<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="__BASE_HREF__">
  <title>HASSAI Bridge</title>
  <script>window.HASSAI_BASE = "__INGRESS_PATH__";</script>
  <link rel="stylesheet" href="static/css/chat.css?v=__CACHE_BUSTER__">
</head>
<body class="chat-app">
  <header class="chat-top">
    <div class="chat-brand">
      <span class="chat-brand-mark">HASSAI</span>
      <span class="chat-brand-sub">Bridge</span>
      <span class="chat-version" id="versionBadge">__VERSION__</span>
    </div>
    <nav class="chat-nav">
      <a class="chat-nav-link active" href="./" aria-current="page">Chat</a>
      <a class="chat-nav-link" href="settings">Settings</a>
    </nav>
  </header>

  <main class="chat-main" id="chatMain">
    <div class="chat-welcome" id="chatWelcome">
      <h1 class="chat-welcome-title">HASSAI</h1>
      <p class="chat-welcome-text">Ask anything about your home — automations, devices, or just chat with your local AI.</p>
    </div>
    <div class="chat-messages" id="chatMessages" hidden></div>
  </main>

  <footer class="chat-composer">
    <form class="chat-form" id="chatForm" autocomplete="off">
      <textarea
        id="chatInput"
        class="chat-input"
        rows="1"
        placeholder="Message HASSAI…"
        enterkeyhint="send"
        aria-label="Message"
      ></textarea>
      <button type="submit" class="chat-send" id="chatSend" aria-label="Send">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </form>
    <p class="chat-hint">Streaming via your configured provider · <a href="settings">Open Settings</a></p>
  </footer>

  <script src="static/js/chat.js?v=__CACHE_BUSTER__"></script>
</body>
</html>
