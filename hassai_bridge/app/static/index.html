<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content">
  <title>HASSAI Bridge</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="hassai-build" content="__CACHE_BUSTER__">
  <script>
    window.HASSAI_BUILD = "__CACHE_BUSTER__";
    window.HASSAI_BASE = (function () {
      var injected = "__INGRESS_PATH__".replace(/\/$/, "");
      if (injected && injected.indexOf("__") !== 0) return injected;
      var m = location.pathname.match(/^(.*?\/api\/hassio_ingress\/[^/]+)/);
      return m ? m[1] : "";
    })();
  </script>
  <link rel="stylesheet" href="static/css/chat.css?v=__CACHE_BUSTER__">
</head>
<body class="chat-app">
  <button type="button" class="chat-sidebar-toggle" id="sidebarToggle" title="Chats" aria-label="Chats">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
  </button>
  <a class="chat-settings" id="chatSettingsLink" href="settings" title="Settings" aria-label="Settings"
     style="position:fixed;top:28px;right:28px;z-index:20;width:44px;height:44px;display:grid;place-items:center;border-radius:14px;color:#7a7e92;background:rgba(24,27,37,.85);border:1px solid #252836;text-decoration:none;box-sizing:border-box">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.86 14.5a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>
    </svg>
  </a>

  <div class="chat-sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="chat-sidebar" id="chatSidebar" aria-hidden="true">
    <div class="chat-sidebar-head">
      <strong id="chatSidebarTitle">Chats</strong>
      <button type="button" class="chat-sidebar-new" id="newChatBtn">New</button>
    </div>
    <div class="chat-sidebar-user" id="chatUserLabel">—</div>
    <div class="chat-sidebar-list" id="chatSessionList"></div>
  </aside>

  <main class="chat-main" id="chatMain">
    <div class="chat-welcome" id="chatWelcome">
      <h1 class="chat-welcome-title">HASSAI</h1>
      <p class="chat-welcome-text" id="chatWelcomeText">Your Home Assistant copilot.</p>
      <p class="chat-version" id="chatVersion">__VERSION__</p>
      <p class="chat-welcome-note" id="haStatus" hidden></p>
    </div>
    <div class="chat-messages" id="chatMessages" hidden></div>
  </main>

  <footer class="chat-composer">
    <form class="chat-form" id="chatForm" autocomplete="off">
      <textarea
        id="chatInput"
        class="chat-input"
        rows="1"
        placeholder="Message HASSAI…"
        enterkeyhint="send"
        aria-label="Message"
      ></textarea>
      <button type="submit" class="chat-send" id="chatSend" aria-label="Send">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </form>
  </footer>

  <script>
    (function () {
      var s = document.createElement("script");
      s.src = "static/js/chat.js?v=__CACHE_BUSTER__";
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
