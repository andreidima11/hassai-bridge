<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HASSAI Bridge</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="hassai-build" content="__CACHE_BUSTER__">
  <script>
    window.HASSAI_BUILD = "__CACHE_BUSTER__";
    window.HASSAI_VERSION = "__VERSION__";
    window.HASSAI_BASE = (function () {
      var injected = "__INGRESS_PATH__".replace(/\/$/, "");
      if (injected && injected.indexOf("__") !== 0) return injected;
      var m = location.pathname.match(/^(.*?\/api\/hassio_ingress\/[^/]+)/);
      return m ? m[1] : "";
    })();
    window.HASSAI_CHAT_LANG = (function () {
      try {
        var s = localStorage.getItem("hassai.language");
        if (s === "ro" || s === "en") return s;
      } catch (e) {}
      return "en";
    })();
    var lang = window.HASSAI_CHAT_LANG;
  </script>
  <link rel="stylesheet" href="__ASSET_PREFIX__/static/css/chat.css?v=__CACHE_BUSTER__">
</head>
<body class="chat-app">
  <div class="app" id="app">
    <div class="chat-sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="chat-sidebar" id="chatSidebar" aria-hidden="true">
      <div class="chat-sidebar-head">
        <strong id="chatSidebarTitle">Chats</strong>
        <button type="button" class="chat-sidebar-new" id="newChatBtn" title="New" aria-label="New">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="chat-sidebar-list" id="chatSessionList"></div>
      <div class="chat-sidebar-foot">
        <span class="chat-sidebar-user" id="chatUserLabel">—</span>
      </div>
    </aside>

    <div class="chat-column">
      <header class="app-chrome">
        <button type="button" class="chat-sidebar-toggle" id="sidebarToggle" title="Chats" aria-label="Chats">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <span class="hassai-build-stamp" id="hassaiBuildStamp" aria-hidden="true"></span>
        <a class="chat-settings" id="chatSettingsLink" href="__ASSET_PREFIX__/settings" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.86 14.5a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>
          </svg>
        </a>
      </header>

      <div class="chat-shell" id="chatShell">
        <main class="chat-main" id="chatMain">
          <div class="chat-welcome" id="chatWelcome">
            <h1 class="chat-welcome-title" id="chatWelcomeTitle">What can I help with?</h1>
            <p class="chat-welcome-text" id="chatWelcomeText">Ask about devices, dashboards, or Home Assistant.</p>
          </div>
          <div class="chat-scroller" id="chatScroller">
            <div class="chat-messages" id="chatMessages" hidden></div>
            <div class="chat-end" id="chatEnd" aria-hidden="true"></div>
          </div>
        </main>
        <footer class="chat-composer">
          <form class="chat-form" id="chatForm" autocomplete="off">
            <textarea
              id="chatInput"
              class="chat-input"
              rows="1"
              placeholder="Message HASSAI…"
              enterkeyhint="send"
              aria-label="Message"
            ></textarea>
            <div class="chat-form-bar">
              <button type="submit" class="chat-send" id="chatSend" aria-label="Send">
                <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M12 19V5M5 12l7-7 7 7"/></svg>
              </button>
            </div>
          </form>
        </footer>
      </div>
    </div>
  </div>
  <script src="__ASSET_PREFIX__/static/js/chat.js?v=__CACHE_BUSTER__"></script>
  <script>
    (function () {
      var el = document.getElementById("hassaiBuildStamp");
      if (el) el.textContent = String(window.HASSAI_VERSION || "").replace(/^v?/, "v");
      var base = window.HASSAI_BASE || "";
      var build = window.HASSAI_BUILD || "";
      fetch(base + "/api/build", { cache: "no-store", credentials: "same-origin" })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d || !d.build || d.build === build) return;
          var u = new URL(location.href);
          if (u.searchParams.get("_b") === d.build) return;
          u.searchParams.set("_b", d.build);
          location.replace(u.toString());
        })
        .catch(function () {});
    })();
  </script>
</body>
</html>
