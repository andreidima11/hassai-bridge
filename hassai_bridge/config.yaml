# https://developers.home-assistant.io/docs/add-ons/configuration
# Keep `version` identical to the root /VERSION file (no leading "v").
# Bumping this on main is what makes Home Assistant show an add-on update.
name: HASSAI Bridge
version: "0.2.10-beta"
slug: hassai_bridge
description: AI bridge for Home Assistant — agentic chat, memory, and LLM proxy
url: https://github.com/andreidima11/hassai-bridge
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8899
ingress_stream: true
panel_icon: mdi:robot-outline
panel_title: HASSAI
panel_admin: false
homeassistant_api: true
hassio_api: true
hassio_role: manager
ports:
  8899/tcp: 8899
ports_description:
  8899/tcp: HASSAI Bridge API (integration + optional direct access)
map:
  - homeassistant_config:rw
  - addon_config:rw
  - share:rw
  - media:rw
options:
  log_level: info
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
