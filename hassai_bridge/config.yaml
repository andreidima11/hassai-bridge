# https://developers.home-assistant.io/docs/add-ons/configuration
name: HASSAI Bridge
version: "0.2.0"
slug: hassai_bridge
description: AI bridge for Home Assistant — agentic chat, memory, and LLM proxy
url: https://github.com/andreidima11/hassai-bridge
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8899
ingress_stream: true
panel_icon: mdi:robot-outline
panel_title: HASSAI
panel_admin: false
homeassistant_api: true
ports:
  8899/tcp: null
ports_description:
  8899/tcp: Direct access (optional; prefer Ingress)
map:
  - addon_config:rw
  - share:rw
options:
  log_level: info
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
